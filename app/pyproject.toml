[project]
name = "map-qa"
version = "0.1.0"
description = "Map QA: speed-limit sign review for Kraków (MVP, phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "pyarrow==23.0.1",
    "httpx==0.28.1",
    "pillow==12.0.0",
]

[project.scripts]
map-qa = "map_qa.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/map_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real external services (OpenRouter, Databricks); run with --run-live",
]
addopts = "-ra"

# Self-contained permission example; merge selected settings deliberately.
# Merge into $CODEX_HOME/config.toml (or ~/.codex/config.toml when CODEX_HOME is unset).
# Comment active sandbox_mode selectors and remove active [sandbox_workspace_write] tables from loaded layers.
# This file is a permissions example, separate from model/provider --profile presets.
# User default: normal sandbox in every project.
# Opt in to the defined course profile globally by changing this to "course-tools".
# A trusted project's .codex/config.toml can select course-tools only for that project.
# sandbox_mode = "danger-full-access" # Demonstration only: disables local sandbox restrictions.
# Do not keep any active sandbox_mode when using named permission profiles.
default_permissions = ":workspace"
approval_policy = "on-request"
# Default tool-output history budget; tools can override it and raw rollouts retain output.
tool_output_token_limit = 4000
approvals_reviewer = "auto_review" # Route eligible approval requests to the reviewer agent.
web_search = "cached" # Separate hosted capability, as in Claude's WebSearch allow.

[windows]
sandbox = "elevated"

[features]
# Tested course baseline; MXC requires a separate acceptance run.
prefer_mxc = false
network_proxy = false
# Domain restrictions require separate proxy activation and validation.

# Beta permission profiles; use instead of sandbox_mode / sandbox_workspace_write.
# Higher-precedence sandbox_mode/--sandbox can select legacy behavior; inspect the effective profile.
# See course-materials/agent-configs/codex/PERMISSIONS.md for scope and platform limits.

# Opt-in course-tools profile: no OS deny-read for .env/secrets; use only with synthetic course data.
[permissions.course-tools]
description = "Default course editing: workspace/temp writes, network enabled, no secret-file deny-read; rules allow selected host commands outside the sandbox."
extends = ":workspace"

[permissions.course-tools.network]
enabled = true

[permissions.course-tools.network.domains]
"*" = "allow"

[permissions.course-workspace]
description = "Strict editing: workspace/temp writes and network enabled; named .env files and secrets paths are denied."
extends = ":workspace"

[permissions.course-workspace.filesystem]
# Linux/WSL and native Windows snapshot deny-glob matches before sandbox startup.
# This is a scanning bound, not a guarantee about paths deeper than 12 levels.
glob_scan_max_depth = 12

[permissions.course-workspace.filesystem.":workspace_roots"]
# Exact denials also protect absent paths; keep them alongside bounded recursive globs.
".env" = "deny"
".env.local" = "deny"
".env.dev" = "deny"
".env.prod" = "deny"
".env.test" = "deny"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.dev" = "deny"
"**/.env.prod" = "deny"
"**/.env.test" = "deny"
"secrets" = "deny"
"**/secrets/**" = "deny"
# A synthetic template is available for inspection but cannot be edited in this profile.
".env.example" = "read"

[permissions.course-workspace.network]
enabled = true

[permissions.course-workspace.network.domains]
# Public network access is available in the default profile.
# This does not request automatic review for every network connection.
"*" = "allow"

[permissions.course-root]
description = "Compatibility alias for course-workspace; identical strict filesystem and network permissions."
extends = "course-workspace"
# This named root preset inherits course-workspace network and filesystem policy.
# Logs are available to sandboxed search commands; there is no directory deny.

[permissions.course-review]
description = "Strict review: workspace read-only, secret-file denials retained, temporary directories writable."
extends = "course-workspace"

[permissions.course-review.filesystem.":workspace_roots"]
"." = "read"
# Temporary directories inherited from :workspace remain writable.

[permissions.course-docs]
description = "Strict documentation editing: workspace read-only except docs/; secret-file denials retained; temp writable."
extends = "course-review"

[permissions.course-docs.filesystem.":workspace_roots"]
"docs" = "write"

[permissions.course-jetbrains]
description = "Optional example: workspace editing with secret-file denials; two-host domain policy requires an active network proxy."
# Independent baseline avoids inheriting course-workspace's global host allowance.
extends = ":workspace"

[permissions.course-jetbrains.filesystem]
# Linux/WSL and native Windows snapshot deny-glob matches before sandbox startup.
# This is a scanning bound, not a guarantee about paths deeper than 12 levels.
glob_scan_max_depth = 12

[permissions.course-jetbrains.filesystem.":workspace_roots"]
# Exact denials also protect absent paths; keep them alongside bounded recursive globs.
".env" = "deny"
".env.local" = "deny"
".env.dev" = "deny"
".env.prod" = "deny"
".env.test" = "deny"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.dev" = "deny"
"**/.env.prod" = "deny"
"**/.env.test" = "deny"
"secrets" = "deny"
"**/secrets/**" = "deny"
# A synthetic template is available for inspection but cannot be edited in this profile.
".env.example" = "read"

[permissions.course-jetbrains.network]
enabled = true

[permissions.course-jetbrains.network.domains]
"blog.jetbrains.com" = "allow"
"www.jetbrains.com" = "allow"
# Domain rules require an active network proxy; these user examples do not enable it.
